[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "erp_contabil.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
