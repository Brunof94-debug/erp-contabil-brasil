<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Relatórios financeiros do ERP Contábil Brasil</title>
  <desc id="desc">Tela conceitual dos relatórios financeiros com contas a receber, contas a pagar, vencidos e fluxo previsto.</desc>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="92" fill="#0f172a"/>
  <text x="64" y="56" fill="#fff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800">Relatórios financeiros</text>
  <text x="940" y="56" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Exportação CSV • Fluxo previsto</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="126" width="262" height="118" rx="20" fill="#ecfeff" stroke="#bae6fd"/>
