      <text x="112" y="550">Pagar</text>
      <text x="320" y="550">Fornecedor Logística Sul</text>
      <text x="650" y="550">Vencido</text>
      <text x="850" y="550">Alerta</text>
      <text x="1030" y="550">R$ 320,00</text>
      <text x="112" y="624">Receber</text>
      <text x="320" y="624">Clínica Horizonte</text>
      <text x="650" y="624">Este mês</text>
      <text x="850" y="624">Em aberto</text>
