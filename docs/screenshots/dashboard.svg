<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard do ERP Contábil Brasil</title>
  <desc id="desc">Visão do dashboard com indicadores de empresas, clientes, fornecedores, lançamentos e fluxo financeiro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <rect width="1280" height="118" fill="url(#bg)"/>
  <text x="64" y="56" fill="#fff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">ERP Contábil Brasil</text>
  <text x="64" y="88" fill="#cffafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Gestão contábil e financeira para empresas brasileiras</text>
  <g fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
    <text x="725" y="66">Dashboard</text>
    <text x="820" y="66">Clientes</text>
    <text x="900" y="66">Lançamentos</text>
    <text x="1020" y="66">Financeiro</text>
    <text x="1120" y="66">Relatórios</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="64" y="154" width="1152" height="530" rx="28" fill="#fff"/>
  </g>
  <text x="104" y="214" fill="#0f766e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MVP VALIDADO LOCALMENTE</text>
  <text x="104" y="254" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Controle financeiro, contábil e operacional</text>
  <text x="104" y="294" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">em uma única base.</text>
  <text x="104" y="328" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Multiempresa, plano de contas, lançamentos balanceados e relatórios gerenciais.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect x="104" y="350" width="160" height="96" rx="18" fill="#ecfeff"/>
      <text x="128" y="386" fill="#0369a1" font-size="13" font-weight="700">EMPRESAS</text>
      <text x="128" y="425" fill="#0f172a" font-size="34" font-weight="800">1</text>
    </g>
    <g>
      <rect x="284" y="350" width="160" height="96" rx="18" fill="#f0fdf4"/>
      <text x="308" y="386" fill="#15803d" font-size="13" font-weight="700">CLIENTES</text>
      <text x="308" y="425" fill="#0f172a" font-size="34" font-weight="800">3</text>
    </g>
    <g>
      <rect x="464" y="350" width="160" height="96" rx="18" fill="#fff7ed"/>
      <text x="488" y="386" fill="#c2410c" font-size="13" font-weight="700">FORNECEDORES</text>
      <text x="488" y="425" fill="#0f172a" font-size="34" font-weight="800">3</text>
    </g>
    <g>
      <rect x="644" y="350" width="160" height="96" rx="18" fill="#eff6ff"/>
      <text x="668" y="386" fill="#1d4ed8" font-size="13" font-weight="700">LANÇAMENTOS</text>
      <text x="668" y="425" fill="#0f172a" font-size="34" font-weight="800">3</text>
    </g>
    <g>
      <rect x="824" y="350" width="160" height="96" rx="18" fill="#f5f3ff"/>
      <text x="848" y="386" fill="#6d28d9" font-size="13" font-weight="700">CONTAS</text>
      <text x="848" y="425" fill="#0f172a" font-size="34" font-weight="800">6</text>
    </g>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="104" y="490" width="520" height="136" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="132" y="528" fill="#0f172a" font-size="20" font-weight="800">Fluxo financeiro previsto</text>
    <rect x="132" y="560" width="420" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="132" y="560" width="223" height="18" rx="9" fill="#0891b2"/>
    <text x="132" y="606" fill="#475569" font-size="16">Receber: 53% • Pagar: 47% • Saldo previsto: R$ 99,10</text>
    <rect x="676" y="490" width="456" height="136" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="704" y="528" fill="#0f172a" font-size="20" font-weight="800">Saúde contábil</text>
    <text x="704" y="578" fill="#16a34a" font-size="36" font-weight="900">3 lançamentos postados</text>
    <text x="704" y="608" fill="#475569" font-size="16">Validação de partidas dobradas preservada.</text>
  </g>
</svg>
