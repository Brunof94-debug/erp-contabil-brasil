{% extends "base.html" %}

{% block title %}{{ title }} — ERP Contábil Brasil{% endblock %}

{% block content %}
  <section class="panel">
    <p class="eyebrow">Confirmação</p>
    <h1>{{ title }}</h1>
    <p>Tem certeza que deseja excluir este registro?</p>
    <p><strong>{{ object }}</strong></p>
    <form method="post" class="form-actions">
      {% csrf_token %}
      <button class="button danger-button" type="submit">Sim, excluir</button>
      <a href="javascript:history.back()">Cancelar</a>
    </form>
  </section>
{% endblock %}
